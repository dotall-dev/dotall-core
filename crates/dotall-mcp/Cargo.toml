[package]
name = "dotall-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
dotall-core = { version = "0.1.0", path = "../dotall-core" }
dotall-xlsx = { version = "0.1.0", path = "../dotall-xlsx", optional = true }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["xlsx"]
xlsx = ["dep:dotall-xlsx"]
