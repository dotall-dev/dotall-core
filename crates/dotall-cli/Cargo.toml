[package]
name = "dotall-cli"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "dotall_cli"
path = "src/lib.rs"

[[bin]]
name = "dotall"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
dotall-core = { version = "0.1.0", path = "../dotall-core" }
dotall-xlsx = { version = "0.1.0", path = "../dotall-xlsx", optional = true }
dotall-pptx = { version = "0.1.0", path = "../dotall-pptx", optional = true }
dotall-docx = { version = "0.1.0", path = "../dotall-docx", optional = true }
dotall-pdf = { version = "0.1.0", path = "../dotall-pdf", optional = true }
rust_xlsxwriter = "0.96.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = "0.12.0"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
webbrowser = "1.2.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
dotall-pptx = { version = "0.1.0", path = "../dotall-pptx" }
dotall-docx = { version = "0.1.0", path = "../dotall-docx" }
dotall-pdf = { version = "0.1.0", path = "../dotall-pdf" }

[features]
default = ["xlsx", "pptx", "docx", "pdf"]
xlsx = ["dep:dotall-xlsx"]
pptx = ["dep:dotall-pptx"]
docx = ["dep:dotall-docx"]
pdf = ["dep:dotall-pdf"]
