[package]
name = "dotall-cli"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "dotall"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
dotall-core = { version = "0.1.0", path = "../dotall-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
